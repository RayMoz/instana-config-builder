name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} – ${{ matrix.yaml }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
        yaml: ["mit PyYAML", "ohne PyYAML"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema
          if [ "${{ matrix.yaml }}" = "mit PyYAML" ]; then pip install PyYAML; fi
      - name: Katalog prüfen
        run: python tools/validate_catalog.py --stats
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff black
      - run: ruff check .
      - run: black --check --target-version py37 .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes prettier@3.3.3 --check "web/**/*.{js,css,html}" "catalog/**/*.json"
